name: CI

# Trigger the workflow on push and pull request events for the dev and main branches
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Define jobs to run in the workflow
jobs:
  # Job: Build and Test
  build-and-test:
    # Run on the latest Ubuntu runner for compatibility and performance
    runs-on: ubuntu-latest

    # Steps to execute in the job
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      # Uses Node.js 22 (compatible with your esbuild target: node22)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm' # Cache pnpm dependencies for faster installs

      # Step 3: Install pnpm
      # Matches your packageManager: pnpm@10.10.0
      - name: Install pnpm
        run: npm install -g pnpm@10.10.0

      # Step 4: Install project dependencies
      - name: Install Dependencies
        run: pnpm install

      # Step 5: Run ESLint to check code style and catch potential issues
      - name: Lint
        run: pnpm lint

      # Step 6: Run TypeScript type-checking without emitting output
      - name: Type Check
        run: pnpm type-check

      # Step 7: Run Jest tests with coverage
      # Generates coverage reports to ensure test quality
      - name: Run Tests
        run: pnpm test:coverage

      # Step 8: Build the project in development mode
      # Uses transpileOnlyConfig (no minification, fast builds)
      - name: Build (Development)
        run: pnpm build

      # Step 9: Build the project in production mode
      # Uses bundleConfig (minified, with metafile for analysis)
      - name: Build (Production)
        run: pnpm build:prod

      # Step 10: Upload esbuild metafile for bundle analysis (optional)
      # Only runs if esbuild-meta.json is generated by build:prod
      - name: Upload Metafile
        uses: actions/upload-artifact@v4
        with:
          name: esbuild-metafile
          path: esbuild-meta.json
          if-no-files-found: ignore # Don't fail if metafile is missing